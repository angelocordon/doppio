name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Test source
        run: bun run test
      - name: Build
        run: bun run build
      - name: Test compiled binary
        run: DOPPIO_BINARY=./dist/doppio bun run test
      - name: Package
        run: |
          name="doppio-darwin-${{ matrix.arch }}"
          mkdir -p "package/$name"
          cp dist/doppio LICENSE README.md "package/$name/"
          ln -s doppio "package/$name/dop"
          tar -czf "$name.tar.gz" -C package "$name"
          "package/$name/dop" --version
      - uses: actions/upload-artifact@v4
        with:
          name: doppio-darwin-${{ matrix.arch }}
          path: doppio-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          shasum -a 256 *.tar.gz > SHA256SUMS
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" "${prerelease[@]}"
